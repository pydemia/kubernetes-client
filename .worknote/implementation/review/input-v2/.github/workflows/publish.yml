name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verification.yml
    with:
      ref: ${{ inputs.tag }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Verify the release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match the package version")
          PY
      - name: Install build and test dependencies
        run: python -m pip install . build twine
      - name: Run compatibility tests
        run: python -m unittest discover -s tests -v
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Save distributions
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kubernetes-client/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish v1.14.2
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
